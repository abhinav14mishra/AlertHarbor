map $uri $safe_uri {
    ~^/api/alerts/v1/alerts/[^/]+$ /api/alerts/v1/alerts/[REDACTED];
    default $uri;
}
log_format opspulse_safe '$remote_addr - $request_method $safe_uri $status $body_bytes_sent';
server {
 listen 8080;
 access_log /dev/stdout opspulse_safe;
 error_log /dev/stderr warn;
 client_max_body_size 1m;
 root /usr/share/nginx/html;
 index index.html;
 location /api/ { proxy_pass http://gateway:8000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
 location /health { proxy_pass http://gateway:8000/health; }
 location / { try_files $uri $uri/ /index.html; }
}
